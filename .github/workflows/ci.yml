name: CI & Deployment Safety Net

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Baseline Exists
        run: |
          if [ ! -f "BASELINE.md" ]; then
            echo "Error: BASELINE.md is missing."
            exit 1
          fi

      - name: Check Tailwind CDN
        run: |
          if ! grep -q "cdn.tailwindcss.com" index.html; then
            echo "Error: Tailwind CSS CDN reference missing in index.html."
            exit 1
          fi

  deploy:
    needs: verify-and-guard
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        
